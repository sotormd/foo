name: Build Foobar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Build
        run: |
          nix build -f foobar build.diskImage --impure
	  cp result image.raw

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: foobar-disk-image
          path: image.raw
